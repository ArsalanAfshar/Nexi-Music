name: Android CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Recover the already-public v0.1.0 test keystore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0 --pattern 'Nexi-Music-0.1.0-TEST-KEYSTORE.jks' --dir "$RUNNER_TEMP"
          echo "::notice title=Public test keystore base64::$(base64 -w0 "$RUNNER_TEMP/Nexi-Music-0.1.0-TEST-KEYSTORE.jks")"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build debug APK
        shell: bash
        run: |
          set +e
          gradle testDebugUnitTest assembleDebug --stacktrace > build-output.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            echo 'Gradle diagnostic summary:'
            while IFS= read -r line; do echo "::error title=Gradle diagnostic::$line"; done < <(grep -Ei '(^e: |error:|What went wrong:|Execution failed for task|Could not |Caused by:|FAILURE:|Unresolved reference|Type mismatch|Overload resolution ambiguity|Expecting |failed|exception|denied|timed out)' build-output.log | tail -n 80)
            echo 'Gradle output tail:'
            tail -n 20 build-output.log
          else
            tail -n 25 build-output.log
          fi
          exit "$result"
