name: Android CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build debug APK
        shell: bash
        run: |
          set +e
          gradle testDebugUnitTest assembleDebug --stacktrace > build-output.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 80 build-output.log)
          else
            tail -n 25 build-output.log
          fi
          exit "$result"
