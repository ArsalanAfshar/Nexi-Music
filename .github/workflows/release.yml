name: Nexi Music test release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Create or recover the public test signing key
        env:
          VERSION_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${VERSION_TAG#v}"
          key_dir="$RUNNER_TEMP/nexi-test-signing"
          mkdir -p "$key_dir"
          keystore="$key_dir/Nexi-Music-${version}-TEST-KEYSTORE.jks"
          alias='nexi-public-test'
          password='NexiMusicTest2026'

          # The public test identity is committed in the repository and is also backed
          # up on each pre-release. Never silently rotate this key: existing installs
          # must remain updateable, even when a tagged workflow is rerun.
          repository_key="$GITHUB_WORKSPACE/signing/Nexi-Music-TEST-KEYSTORE.jks"
          test -s "$repository_key" || { echo 'Committed public test keystore is missing.' >&2; exit 1; }
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release download "$VERSION_TAG" --pattern "$(basename "$keystore")" --dir "$key_dir"
            test -s "$keystore" || { echo 'Existing release is missing its signing-key backup; refusing to rotate it.' >&2; exit 1; }
            cmp -s "$repository_key" "$keystore" || { echo 'Existing release key does not match the committed test key; refusing to sign.' >&2; exit 1; }
          else
            cp "$repository_key" "$keystore"
          fi

          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo 'ANDROID_KEYSTORE_TYPE=JKS' >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build signed ABI and universal APKs
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION_TAG#v}"
          IFS=. read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( minor < 1000 && patch < 1000 ))
          version_code=$((major * 1000000 + minor * 1000 + patch))
          gradle -PappVersionName="$version" -PappVersionCode="$version_code" assembleRelease
      - name: Name APKs and prepare test-key backup
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION_TAG#v}"
          mkdir -p release-assets
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            file=$(basename "$apk")
            abi=${file#app-}
            abi=${abi%-release.apk}
            cp "$apk" "release-assets/Nexi-Music-${version}-${abi}.apk"
          done
          test -n "$(find release-assets -name '*.apk' -print -quit)"
          for apk in release-assets/*.apk; do "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"; done

          cp "$ANDROID_KEYSTORE_FILE" "release-assets/Nexi-Music-${version}-TEST-KEYSTORE.jks"
          fingerprint=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_FILE" -storetype JKS -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/ {print $2; exit}')
          cat > "release-assets/Nexi-Music-${version}-TEST-KEY-CREDENTIALS.txt" <<CREDENTIALS
          PUBLIC TEST SIGNING KEY — NOT FOR PRODUCTION
          Release: Nexi Music ${version}
          Keystore file: Nexi-Music-${version}-TEST-KEYSTORE.jks
          Keystore type: JKS
          Alias: ${ANDROID_KEY_ALIAS}
          Keystore password: ${ANDROID_KEYSTORE_PASSWORD}
          Key password: ${ANDROID_KEY_PASSWORD}
          Signing certificate SHA-256: ${fingerprint}

          These test credentials are intentionally public. Anyone can sign APKs as this test identity.
          APKs signed by a different key cannot update these installs. When moving to a private release
          key, users must uninstall this test build and install the new signed app.
          CREDENTIALS
          ls -lh release-assets
      - name: Prepare version-specific release notes
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          version="${VERSION_TAG#v}"
          awk -v heading="## ${version}" '/^## / { if (found) exit; found = index($0, heading) == 1 } found { print }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then printf 'Nexi Music %s\n\nSee the repository changelog and README for details.\n' "$version" > release-notes.md; fi
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: Nexi Music ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
