name: Signed Android release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEY_ALIAS" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD" || { echo 'Release signing secrets are required; refusing to publish unsigned APKs.' >&2; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nexi-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/nexi-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed ABI and universal APKs
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          version="${VERSION_TAG#v}"
          IFS=. read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( minor < 1000 && patch < 1000 ))
          version_code=$((major * 1000000 + minor * 1000 + patch))
          gradle -PappVersionName="$version" -PappVersionCode="$version_code" assembleRelease
      - name: Name release APKs
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          mkdir -p release-assets
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            file=$(basename "$apk")
            abi=${file#app-}
            abi=${abi%-release.apk}
            cp "$apk" "release-assets/Nexi-Music-${version}-${abi}.apk"
          done
          test -n "$(find release-assets -name '*.apk' -print -quit)"
          for apk in release-assets/*.apk; do "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"; done
          ls -lh release-assets
      - name: Prepare version-specific release notes
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          version="${VERSION_TAG#v}"
          awk -v heading="## ${version}" '/^## / { if (found) exit; found = index($0, heading) == 1 } found { print }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then printf 'Nexi Music %s

See the repository changelog and README for details.
' "$version" > release-notes.md; fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Nexi Music ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*.apk
          fail_on_unmatched_files: true
